name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flowforge_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: flowforge_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowforge_test -d flowforge_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_USER: flowforge_test
      POSTGRES_PASSWORD: test_only
      POSTGRES_DB: flowforge_ci
      POSTGRES_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: node --check static/dashboard.js
      - run: node --check static/theme.js
      - run: npm test
      - run: python -m pytest -q
      - run: python scripts/verify_pipeline.py
      - run: npx playwright install --with-deps chromium
      - run: python scripts/run_browser_tests.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
